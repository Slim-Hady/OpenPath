name: opensource-helper-dev

# Local dependencies for development and integration tests.
#
#   docker compose -f docker-compose.dev.yml up -d
#   ./scripts/dev-services.sh up
#
# Supabase still provides Auth and Storage. Only Postgres and Redis run here.
# Use this when you want to work without touching the Supabase database.
#
# Do not run this at the same time as `docker compose up` from the root file:
# both publish 6379 and the root stack already has its own Redis.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-osh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osh_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-osh}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osh} -d ${POSTGRES_DB:-osh}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
