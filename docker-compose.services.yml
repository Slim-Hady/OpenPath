name: osh-services

# PM1 per-service stack: one container + one database per service.
# Run: docker compose -f docker-compose.services.yml up --build
# The product app itself is still the root docker-compose.yml (web + api + worker).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: osh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osh_services_local}
      POSTGRES_DB: osh
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osh -d osh"]
      interval: 5s
      timeout: 3s
      retries: 20

  account:
    build:
      context: .
      dockerfile: services/account/Dockerfile
    environment:
      DATABASE_URL: postgresql://osh:${POSTGRES_PASSWORD:-osh_services_local}@postgres:5432/account_db
      PORT: 3000
    ports:
      - "4101:3000"
    depends_on:
      postgres:
        condition: service_healthy

  developer-profile:
    build:
      context: .
      dockerfile: services/developer-profile/Dockerfile
    environment:
      DATABASE_URL: postgresql://osh:${POSTGRES_PASSWORD:-osh_services_local}@postgres:5432/developer_profile_db
